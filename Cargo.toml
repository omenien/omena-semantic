[package]
name = "omena-semantic"
version = "0.1.7"
edition = "2024"
license = "MIT"
description = "Semantic boundary crate for Omena style analysis"
repository = "https://github.com/omenien/omena-semantic"
readme = "README.md"
keywords = ["omena", "css-modules", "semantic", "analysis"]
categories = ["development-tools"]
exclude = [".github/**"]

[lib]
name = "omena_semantic"

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { package = "omena-engine-input-producers", version = "0.1.2" }
engine-style-parser = { package = "omena-engine-style-parser", version = "0.1.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
