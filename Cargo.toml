[package]
name = "omena-semantic"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Semantic boundary crate for CSS Module Explainer style analysis"
repository = "https://github.com/omenien/omena-semantic"
readme = "README.md"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { git = "https://github.com/omenien/omena-engine-input-producers.git", rev = "074b2fd" }
engine-style-parser = { git = "https://github.com/omenien/omena-engine-style-parser.git", rev = "76d9cde" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
